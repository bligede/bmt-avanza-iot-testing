; =============================================================================
;  bmt-avanza-iot-testing — PlatformIO project
;
;  Bring-up firmware for the Avanza CAN reading test (M1C-ALT).
;  Fleet firmware lives in bligede/bmt-can-bus-telemetry; this is a focused
;  diagnostic build, not a subset of the product.
;
;  THE DEVICE IS LISTEN-ONLY. It reads the vehicle CAN bus and never writes to
;  it. See src/CanBusSafety.h and tools/check_listen_only.sh.
;
;  Build      : PlatformIO toolbar ✓, or  pio run
;  Upload     : PlatformIO toolbar →, or  pio run -t upload
;  Monitor    : PlatformIO toolbar 🔌, or pio device monitor
;  Filesystem : pio run -t uploadfs   (only if you add files under data/)
; =============================================================================

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework  = arduino

; ---- Serial -----------------------------------------------------------------
monitor_speed   = 115200
upload_speed    = 921600
; No filters by default. The `time` filter duplicates the uptime this
; firmware's own logger already prints, and in testing the filter chain
; fragmented the stream badly enough to repeat one line ~150,000 times, which
; on a vehicle test would bury the output that matters. Add the decoder back
; only when chasing a crash backtrace:
;     pio device monitor --filter esp32_exception_decoder
monitor_filters = direct

; ---- Flash / partitions -----------------------------------------------------
; No OTA in this build, so both app slots are collapsed into one and the space
; goes to LittleFS for raw CAN captures. See partitions/avanza_test_16mb.csv.
board_build.partitions      = partitions/avanza_test_16mb.csv
board_build.filesystem      = littlefs
board_build.flash_mode      = qio
board_build.f_flash         = 80000000L

; Board in use: ESP32-S3 (QFN56) rev v0.2, 16 MB flash, 8 MB embedded PSRAM,
; verified with `esptool.py flash_id`. Earlier this file said 8 MB and the
; partition table only spanned half the chip.
;
; For other boards use partitions/avanza_test.csv (8 MB) or
; partitions/avanza_test_4mb.csv (4 MB) and match flash_size below.
;
; PSRAM is present but deliberately not enabled: this firmware uses under 18%
; of internal RAM and needs none. Enabling it would add
; board_build.arduino.memory_type = qio_opi, which is correct for THIS board
; but wrong for one without octal PSRAM.
board_upload.flash_size     = 16MB

; Deliberately NOT setting board_build.arduino.memory_type. The common
; qio_opi value assumes OPI PSRAM; on a devkit without it the image can fail
; to boot. This firmware needs no PSRAM — leave the board default alone.

build_flags =
    -D CORE_DEBUG_LEVEL=0          ; this firmware has its own logger
    -Wall
    -Wextra

; ---- Which USB port ---------------------------------------------------------
; USE THE PORT LABELLED "COM" (or "UART"), NOT "USB".
;
; ARDUINO_USB_CDC_ON_BOOT is deliberately left at 0, so Serial is UART0 and
; comes out of the USB-to-UART bridge on the COM port. Three reasons:
;
;   1. The COM port has a physical auto-reset circuit wired to EN and GPIO0.
;      Uploads just work. The native USB port depends on the firmware that is
;      currently running cooperating with a DTR/RTS reset request, which fails
;      whenever that firmware has crashed - exactly when you need to reflash.
;
;   2. If this firmware crashes or the watchdog resets it in a loop, the native
;      USB port DISAPPEARS from the host, because that port is created by the
;      firmware. The bridge on the COM port is a separate chip and keeps
;      working. For a diagnostic tool that is not a convenience, it is the
;      requirement.
;
;   3. The native USB peripheral occupies GPIO19 (D-) and GPIO20 (D+). GPIO19
;      is the GPS TX pin in the blueprint pinout, so using the native port puts
;      the USB peripheral and the GPS UART on the same pin. See Config.h §2.
;
; If you must use the native USB port, set -D ARDUINO_USB_CDC_ON_BOOT=1 here,
; and leave GPS_TX_PIN at -1 so nothing contends for GPIO19.

; ---- Notes ------------------------------------------------------------------
; * Copy src/Secrets.h.example to src/Secrets.h and fill in the hotspot
;   credentials. Secrets.h is git-ignored.
; * ESP32-S3 is 2.4 GHz only. A 5 GHz-only hotspot will never be found.
; * If upload fails, hold BOOT (GPIO0), tap RESET, release BOOT, retry.
