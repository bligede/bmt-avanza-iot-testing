; =============================================================================
;  bmt-avanza-iot-testing — PlatformIO project
;
;  Bring-up firmware for the Avanza CAN reading test (M1C-ALT).
;  Fleet firmware lives in bligede/bmt-can-bus-telemetry; this is a focused
;  diagnostic build, not a subset of the product.
;
;  THE DEVICE IS LISTEN-ONLY. It reads the vehicle CAN bus and never writes to
;  it. See src/CanBusSafety.h and tools/check_listen_only.sh.
;
;  Build      : PlatformIO toolbar ✓, or  pio run
;  Upload     : PlatformIO toolbar →, or  pio run -t upload
;  Monitor    : PlatformIO toolbar 🔌, or pio device monitor
;  Filesystem : pio run -t uploadfs   (only if you add files under data/)
; =============================================================================

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework  = arduino

; ---- Serial -----------------------------------------------------------------
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, time

; ---- Flash / partitions -----------------------------------------------------
; No OTA in this build, so both app slots are collapsed into one and the space
; goes to LittleFS for raw CAN captures. See partitions/avanza_test.csv.
board_build.partitions      = partitions/avanza_test.csv
board_build.filesystem      = littlefs
board_build.flash_mode      = qio
board_build.f_flash         = 80000000L

; If your board has 4 MB rather than 8 MB, switch the line below and use
; partitions/avanza_test_4mb.csv above.
board_upload.flash_size     = 8MB

; Deliberately NOT setting board_build.arduino.memory_type. The common
; qio_opi value assumes OPI PSRAM; on a devkit without it the image can fail
; to boot. This firmware needs no PSRAM — leave the board default alone.

build_flags =
    -D CORE_DEBUG_LEVEL=0          ; this firmware has its own logger
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; serial over the native USB port
    -Wall
    -Wextra

; ---- Notes ------------------------------------------------------------------
; * Copy src/Secrets.h.example to src/Secrets.h and fill in the hotspot
;   credentials. Secrets.h is git-ignored.
; * ESP32-S3 is 2.4 GHz only. A 5 GHz-only hotspot will never be found.
; * If upload fails, hold BOOT (GPIO0), tap RESET, release BOOT, retry.
